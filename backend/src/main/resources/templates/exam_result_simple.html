<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Exam Complete - FastPrep+</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link rel="stylesheet" type="text/css" href="/css/style.css">
    <link rel="stylesheet" type="text/css" href="/css/exam-result-simple.css">
</head>

<body>
    <section class="exam-result-container">
        <div class="result-card">
            <h1>Exam Complete!</h1>
            
            <div class="score-display">
                <h2>Your Score</h2>
                <div class="score-number">
                    <span th:text="${score}">0</span> / <span th:text="${totalQuestions}">0</span>
                </div>
                <div class="score-percentage" th:text="${#numbers.formatDecimal((score * 100.0 / totalQuestions), 1, 1)} + '%'">0%</div>
            </div>
            
            <div class="result-actions">
                <a href="/dashboard" class="btn btn-primary">Go to Dashboard</a>
                <p class="review-note">Your detailed AI-powered review will be available in your dashboard shortly.</p>
            </div>
        </div>
    </section>
</body>
</html>
